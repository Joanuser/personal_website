{ img: 'assets/cb-food1.jpg', alt: 'Chicken shawarma wraps, flatbread and dips on a table', title: 'WISE STEM Community Dinner', org: 'WISE · Women in Science & Engineering', loc: 'Duderstadt Center, Room 1180', closes: '18m', going: 7, foods: 'Pasta: 6 portions · Salad: 1 tray', co2: 35.7 },
{ img: 'assets/cb-food2.jpg', alt: 'A grain bowl with chicken, avocado and chickpeas', title: 'Pizza & Conversation: Psychology + BCN', org: 'Psychology Student Association', loc: 'East Hall, Room 4464', closes: '1h 10m', going: 4, foods: 'Pizza: 5 slices · Bowls: 3', co2: 42.0 }];
const cb = st.cb || { tab: 'list', ev: [{}, {}] };
const setCb = (patch) => this.setState({ cb: Object.assign({}, cb, patch) });
const co2 = evData.reduce((t, e, i) => t + (cb.ev[i].report === 'Collected food' ? e.co2 : 0), 92.3);
const water = 2 + cb.ev.filter(e => e.report).length;
const stagesCb = [{ name: 'Seed', at: 0, next: 100 }, { name: 'Seedling', at: 100, next: 160 }, { name: 'Sapling', at: 160, next: 250 }, { name: 'Little tree', at: 250, next: 400 }];
let sIdx = 0; stagesCb.forEach((x, i) => { if (co2 >= x.at) sIdx = i; });

const cbEvents = evData.map((e, i) => {
const es = cb.ev[i];
const mark = (report) => () => { const ev = cb.ev.map((x, j) => j === i ? Object.assign({}, x, { report: report }) : x);
this.setState({ cb: Object.assign({}, cb, { ev: ev, toast: 'water' + i + Date.now() }) });
setTimeout(() => { const c = (this.state || {}).cb; if (c) this.setState({ cb: Object.assign({}, c, { tab: 'me', seenMe: true, grew: report === 'Collected food' ? i + 1 : 0 }) }); }, 1100); };
return Object.assign({}, e, {

got: mark('Collected food'), gone: mark('Food was gone') });
});
const doneCount = cb.ev.filter(e => e.report).length;

const stepState = [!cb.ev[0].going && !cb.ev[1].going, (cb.ev[0].going && !cb.ev[0].report) || (cb.ev[1].going && !cb.ev[1].report), cb.tab === 'me' && doneCount >= 1, doneCount === 1 && cb.tab === 'list' && seen && !(cb.ev[0].going && cb.ev[1].going)];
const stepDone = [cb.ev[0].going || cb.ev[1].going, doneCount >= 1, seen && cb.tab === 'list', doneCount === 2];
const stepText = [['Find free food', 'Tap \u201cI\u2019m going\u201d on the WISE dinner.'], ['Report what you found', 'Tap \u201cGot some!\u201d once you have picked it up.'], ['Watch your tree grow', 'Your report waters your tree.'], ['Do it again', 'Go back and claim the pizza, too.']];
const cbSteps = stepText.map((t, i) => ({ n: i + 1, title: t[0], hint: t[1], on: (doneCount === 2 && i !== 2 ? false : stepState[i]) ? 'true' : 'false', done: stepDone[i] ? 'true' : 'false' }));
return {
pins: pins,
count: all ? '79' : '3',
countLabel: all ? 'events with food, matching words like "lunch provided" and "pizza"' : 'events tagged "free food"',
countNote: all ? 'same calendar, same week' : 'that is all a student would find',
countInk: all ? '#2F6B45' : '#B0573F',
searchFree: () => this.setState({ all: false }), searchAll: () => this.setState({ all: true }),
freePressed: all ? 'false' : 'true', allPressed: all ? 'true' : 'false',
freeBg: all ? 'transparent' : dark, freeInk: all ? dark : light,
allBg: all ? dark : 'transparent', allInk: all ? light : dark,
calls: calls,
cbEvents: cbEvents, cbSteps: cbSteps, cbActive: 5 - doneCount,
cbOnList: cb.tab === 'list', cbOnMe: cb.tab === 'me', cbListOn: cb.tab === 'list' ? 'true' : 'false', cbMeOn: cb.tab === 'me' ? 'true' : 'false',
cbGoList: () => setCb({ tab: 'list', grew: 0, toast: '' }), cbGoMe: () => setCb({ tab: 'me', seenMe: true, grew: 0, toast: '' }),

cbToast: !!cb.toast && cb.tab === 'list', cbToastTitle: 'Thanks for reporting!', cbToastText: 'Your tree was watered.',
cbStage: sIdx, cbStageName: sg.name, cbPct: pct, cbIsSeed: sIdx === 0, cbIsSeedling: sIdx === 1, cbIsSapling: sIdx === 2, cbIsTree: sIdx === 3,
cbUntil: (sg.next - co2).toFixed(1) + ' g CO\u2082 until the next stage.',

cbGrew: !!cb.grew, cbGrewText: cb.grew ? '+' + evData[cb.grew - 1].co2.toFixed(1) + ' g CO\u2082 saved. Your tree grew!' : '',

};
}
}
