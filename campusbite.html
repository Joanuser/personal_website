<p style="position: relative; margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2F6B45">Case study · CampusBite · MHacks 2026</p>
<h1 style="position: relative; margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 56px; line-height: 1.08; letter-spacing: -0.015em; max-width: 840px">80 catered events. Only 3 said "free food."</h1>
<p style="position: relative; margin: 0; font-size: 21px; color: #4A4458; max-width: 740px">A live campus map that finds leftover event food before it's thrown away, and helps students get to it in time.</p>
</section>

<span class="chap-num" style="color: #A04A2E">01</span>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A04A2E">Part 1 of 4</p>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 38px; line-height: 1.1">The project</h2>
<p style="margin: 0; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; color: #4A4458">Who, when, and what I owned</p>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px">
<div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">My role · Product Manager and designer</p>
<p style="margin: 0">As a grad student, I'm always hunting for free food, and this project started from that habit. I:</p>
<ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px">
<li>Spotted the problem and measured it by auditing the U-M events calendar</li>
<li>Talked to about 5 students about how they find free food and what stops them</li>
<li>Designed the desktop app and the mobile layout in Figma</li>
<li>Pushed for two key calls: a required food photo, and a tree that grows with your impact</li>
</ul>
</div>

<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A4790">Part 2 of 4</p>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 38px; line-height: 1.1">Problem &amp; research</h2>
<p style="margin: 0; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; color: #4A4458">What was really broken?</p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Target users</p><p style="margin: 6px 0 0"><strong>Students</strong>, especially on tight budgets, looking for a quick bite between classes. <strong>Event hosts</strong> with leftovers and no quick way to share them.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Problem statement</p><p style="margin: 6px 0 0">Students who would happily take leftover event food rarely hear about it in time, so hosts throw it away.</p></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Product outcome we aimed for</p><p style="margin: 6px 0 0">Students can see where food is right now, and get there before it's gone.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Impact outcome we aimed for</p><p style="margin: 6px 0 0">Less food wasted on campus, and an easy way for hosts to share leftovers.</p></div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">How we researched</p>

<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">~5</p><p style="margin: 0">quick conversations with students</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">1</p><p style="margin: 0">outside study on leftovers per guest, to estimate impact</p></div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Insight 1 · Hosts don't write "free food." Try both searches:</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" onClick="{{searchFree}}" aria-pressed="{{freePressed}}" style="font: inherit; font-weight: 700; color: {{freeInk}}; background: {{freeBg}}; border: 2px solid #2E2A3B; border-radius: 22px 16px 24px 14px; padding: 10px 20px; min-height: 44px; cursor: pointer">Search "free food"</button>
<button type="button" onClick="{{searchAll}}" aria-pressed="{{allPressed}}" style="font: inherit; font-weight: 700; color: {{allInk}}; background: {{allBg}}; border: 2px solid #2E2A3B; border-radius: 16px 24px 14px 22px; padding: 10px 20px; min-height: 44px; cursor: pointer">Search like CampusBite</button>
</div>

<text x="80" y="30" style="font-family: 'Caveat', cursive; font-size: 22px; fill: #5A5468">Central Campus</text>

</sc-for>

<div class="pop" style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 4px">

<p style="margin: 0; font-size: 14px; color: #5A5468">Pins are placed for illustration; counts are from our audit of the U-M events calendar.</p>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Insight 2 · Students find food by accident</p>
<div style="position: relative; padding: 30px 34px; transform: rotate(-0.5deg)">
<svg viewBox="0 0 800 160" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><path d="M8 12 C 260 4, 540 8, 792 6 C 798 60, 796 110, 790 154 C 540 158, 260 156, 12 154 C 4 110, 4 60, 8 12 Z" fill="#F7E3A8" filter="url(#wc)"></path></svg>
<p style="position: relative; margin: 0; font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; line-height: 1.25">Most students only find free food by walking past it. If they knew about it, and it wasn't far, they'd usually go.</p>
</div>
<p style="margin: 0; color: #4A4458">So the product had to solve two things: <strong>knowing</strong> (a live map) and <strong>getting there in time</strong> (distance and countdowns).</p>
</section>

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Three calls I made · what would you choose?</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px">
<sc-for list="{{calls}}" as="q" hint-placeholder-count="3">
