name: Refresh F-1 internships

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the list from official postings
        run: python3 internships/aggregate.py
      - name: Commit the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/internships.json
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Refresh F-1 internship listings"
            git push
          fi
