name: Refresh internship dashboard

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC and does not follow daylight saving.
    # 10:00 UTC is 6:00 AM EDT. 11:00 UTC is 6:00 AM EST.
    # GitHub may start the cron hours late, so the gate uses the Detroit
    # offset instead of requiring the clock to still say 6.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Keep the 6 AM Detroit run
        id: gate
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=America/Detroit date +%z)
          echo "America/Detroit offset is ${offset}; schedule is ${SCHEDULE}"
          if [ "$SCHEDULE" = "0 10 * * *" ] && [ "$offset" = "-0400" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 11 * * *" ] && [ "$offset" = "-0500" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the list from official postings
        if: steps.gate.outputs.run == 'true'
        run: python3 internships/aggregate.py
      - name: Commit the list
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/internships.json
          if git diff --staged --quiet; then
            echo "No listing changes"
          else
            git commit -m "Refresh internship listings"
            git push
          fi
