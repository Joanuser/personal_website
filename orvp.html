<p style="position: relative; margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A4790">Case study · U-M Office of the VP for Research</p>
<h1 style="position: relative; margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 56px; line-height: 1.08; letter-spacing: -0.015em; max-width: 820px">Turning 30-page funding calls into setup-ready data</h1>
<p style="position: relative; margin: 0; font-size: 21px; color: #4A4458; max-width: 720px">An AI assistant that reads a funding call and fills in what the research office needs, with every answer tied to its source, so staff check instead of hunt.</p>
</section>

<section style="position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 22px">
<div id="basics" style="display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #2E2A3B; padding-bottom: 10px; scroll-margin-top: 80px">
<span style="font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #B0573F">part 1</span>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px; line-height: 1.15">The project</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px">
<div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">My role · Product Manager</p>
<p style="margin: 0">I owned the "what" and the "why": I ran the user interviews, wrote the PRD and planned the roadmap. Specifically, I:</p>
<ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px">
<li>Wrote our interview questions, then mapped how a funding call becomes a competition today from the client's answers</li>
<li>Asked the client for hands-on access to their system, and logged every field and its limits</li>
<li>Wrote the PRD: users, essential fields, the four-screen flow, and success metrics</li>
<li>Planned the roadmap, starting with the most painful step</li>
</ul>
</div>
<div style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Team</p><p style="margin: 4px 0 0">Chih-Chi (Joan) Huang, Ric, Joyce, Emrys</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Timeline</p><p style="margin: 4px 0 0">Fall 2026 · about 2 months</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Tools</p><p style="margin: 4px 0 0">Figma (prototype, flowcharts) · Notion (project management) · U-M GPT</p></div>
</div>
</div>
</section>

<section style="position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 22px">
<div id="research" style="display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #2E2A3B; padding-bottom: 10px; scroll-margin-top: 80px">
<span style="font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #6A4F9A">part 2</span>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px; line-height: 1.15">Problem &amp; research</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: center">
<div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Target user</p>
<p style="margin: 0">The research office staff who set up internal competitions for limited-submission funding calls.</p>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Problem statement</p>
<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 22px; line-height: 1.4">Staff read every long, dense funding call by hand and retype its rules into the competition system. The rules hide in different places in each document, and one missed limit goes out to the whole campus.</p>
</div>
<div style="flex: 1 1 280px; display: flex; justify-content: center">
<svg viewBox="0 0 320 300" style="width: 100%; max-width: 340px; height: auto" role="img" aria-label="Illustration of a tall stack of paper with one highlighted line buried in the middle">
<ellipse cx="160" cy="160" rx="150" ry="120" fill="#E59A8C" filter="url(#wc)" style="opacity: 0.4"></ellipse>
<g filter="url(#pc)" style="stroke: #2E2A3B; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round">
<rect x="70" y="70" width="170" height="200" rx="6" fill="#FFFDF8" transform="rotate(-7 155 170)"></rect>
<rect x="80" y="60" width="170" height="200" rx="6" fill="#FFFDF8" transform="rotate(4 165 160)"></rect>
<rect x="76" y="50" width="170" height="200" rx="6" fill="#FFFDF8"></rect>
<path d="M96 80 H 226 M96 98 H 214 M96 116 H 222 M96 134 H 200 M96 152 H 226 M96 170 H 210 M96 188 H 220 M96 206 H 190 M96 224 H 216" fill="none" style="stroke-width: 1.6"></path>
</g>
<path d="M94 170 H 212" stroke="#E9B949" filter="url(#wc)" style="stroke-width: 13; opacity: 0.8"></path>
<text x="226" y="40" style="font-family: 'Caveat', cursive; font-size: 24px; fill: #5A5468">30 pages…</text>
<text x="196" y="292" style="font-family: 'Caveat', cursive; font-size: 22px; fill: #5A5468">the one rule you need</text>
</svg>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px">
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Product outcome we aimed for</p><p style="margin: 6px 0 0">Get every key field from a funding call in one step, each tied to its source, with at least 90% accuracy and zero missed critical rules.</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Business outcome we aimed for</p><p style="margin: 6px 0 0">Show the office, within the pilot, that university-approved AI can make setup faster and more consistent, and leave behind assets staff can maintain without engineers.</p></div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">How we researched</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">3</p><p style="margin: 0">client staff answered our question list in one structured session</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">1</p><p style="margin: 0">hands-on walkthrough of the client's competition system</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">7</p><p style="margin: 0">real, public funding calls as our test set</p></div>
</div>
<p style="margin: 0; font-size: 16px; color: #4A4458">No competitive analysis: this is an internal tool for one office, so the comparison that mattered was against today's manual process.</p>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Key insights</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px">
<li><strong>The pain is translation, not search.</strong> Finding funding calls was fine. Turning one into a competition was slow and risky.</li>
<li><strong>Trust needs a source.</strong> Staff would only rely on an answer they could check against the original text in seconds.</li>
<li><strong>The system has no door.</strong> No API meant any tool had to fit around the system, not inside it.</li>
</ol>
<p style="margin: 0; font-size: 15px; color: #5A5468">Our interview notes, flowcharts and wireframes are covered by an NDA, so they are not shown here.</p>
</section>

<section style="position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 22px">
<div id="decisions" style="display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #2E2A3B; padding-bottom: 10px; scroll-margin-top: 80px">
<span style="font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #2A5F8F">part 3</span>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px; line-height: 1.15">Decisions &amp; pivot</h2>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">The pivot</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">
<div style="flex: 1 1 260px; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #A04A2E">plan A</p><p style="margin: 4px 0 0">Build the tool <strong>into</strong> the existing competition system, so staff never leave it.</p></div>
<div style="flex: 0 0 auto; display: flex; align-items: center; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700">→</div>
<div style="flex: 1 1 260px; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #5A5468">what changed</p><p style="margin: 4px 0 0">The office's IT policy does not let students build into its systems.</p></div>
<div style="flex: 0 0 auto; display: flex; align-items: center; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700">→</div>
<div style="flex: 1 1 260px; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #2F6B45">plan B</p><p style="margin: 4px 0 0">A standalone tool whose output follows the system's exact field order, with one-click copy for each field.</p></div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Working around the constraints · tap a card</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; margin-top: 6px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<button type="button" class="flip" onClick="{{c.toggle}}" aria-expanded="{{c.expanded}}" style="position: relative; text-align: left; font: inherit; color: #2E2A3B; background: none; border: none; padding: 30px 26px; min-height: 280px; cursor: pointer; display: flex; flex-direction: column; gap: 10px">
<svg viewBox="0 0 300 280" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><path d="M14 22 C 100 8, 200 16, 286 12 C 294 100, 290 190, 284 266 C 190 274, 100 270, 18 268 C 8 180, 10 100, 14 22 Z" fill="{{c.fill}}" stroke="#2E2A3B" filter="url(#pc)" style="stroke-width: 2; opacity: {{c.op}}"></path></svg>
<sc-if value="{{c.front}}" hint-placeholder-val="{{ true }}">
<span style="position: relative; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">What we wanted</span>
<span style="position: relative; font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; line-height: 1.2">{{c.want}}</span>
<span style="position: relative; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #A04A2E; margin-top: 8px">What we got</span>
<span style="position: relative; font-family: 'Fraunces', serif; font-size: 22px; line-height: 1.25; text-decoration: line-through; text-decoration-color: #D9705E; text-decoration-thickness: 3px">{{c.got}}</span>
<span style="position: relative; font-family: 'Caveat', cursive; font-size: 23px; font-weight: 700; margin-top: auto">so what did we do? →</span>
</sc-if>
<sc-if value="{{c.back}}" hint-placeholder-val="{{ false }}">
<span class="pop" style="position: relative; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #2F6B45">Our workaround</span>
<span class="pop" style="position: relative; font-family: 'Fraunces', serif; font-size: 21px; line-height: 1.35">{{c.fix}}</span>
<span style="position: relative; font-family: 'Caveat', cursive; font-size: 23px; font-weight: 700; margin-top: auto">← flip back</span>
</sc-if>
</button>
</sc-for>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Key decisions and the evidence behind them</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-weight: 700">AI drafts, a person approves</p><p style="margin: 6px 0 0; color: #4A4458">Evidence: in interviews, one wrong limit goes out to the whole campus. Staff must stay in control of every value.</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-weight: 700">Every value shows its source</p><p style="margin: 6px 0 0; color: #4A4458">Evidence: staff said they would only trust an answer they could check against the original text.</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-weight: 700">Flag conflicts instead of guessing</p><p style="margin: 6px 0 0; color: #4A4458">Evidence: funding calls often state a rule one way on the overview and another way in the FAQ.</p></div>
<div style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-weight: 700">Start with one step, not the whole workflow</p><p style="margin: 6px 0 0; color: #4A4458">Evidence: the office named translating funding calls as its top priority.</p></div>
</div>
</section>

<section style="position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 22px">
<div id="results" style="display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #2E2A3B; padding-bottom: 10px; scroll-margin-top: 80px">
<span style="font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #2F6B45">part 4</span>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px; line-height: 1.15">Solution &amp; results</h2>
</div>
<p style="margin: 0; max-width: 760px">Our working demo is under NDA, so here is an illustration of how it works. Tap a field to see where it came from.</p>
<div style="position: relative; padding: 28px; display: flex; flex-wrap: wrap; gap: 28px">
<svg viewBox="0 0 1000 520" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><path d="M12 30 C 300 8, 700 22, 988 14 C 996 200, 994 380, 984 506 C 700 516, 300 512, 16 508 C 6 360, 8 180, 12 30 Z" fill="#E9F0F8" filter="url(#wc)" style="opacity: 0.9"></path></svg>
<div style="position: relative; flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px">

<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1280,"height":7400}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = st.open || {};
const cardData = [
{ want: 'An API into their system', got: 'No API at all', fill: '#F4C1B6',
  fix: 'We laid out the output in the exact field order of their system, with one-click copy for each field. No integration needed.' },
{ want: 'Internal documents and past data', got: 'Only public information', fill: '#D9D0F0',
  fix: 'Funding calls are public, so we used real ones as our test set and scored the tool against competitions staff had already built.' },
{ want: 'To know what the system needs', got: 'No view of the system', fill: '#F7E3A8',
  fix: 'I asked the client for access. We clicked through every screen and wrote down each field and its limits, so the AI fills in answers that actually fit.' }
];
const cards = cardData.map((c, i) => {
const flipped = !!open[i];
return Object.assign({}, c, {
front: !flipped, back: flipped,
expanded: flipped ? 'true' : 'false',
op: flipped ? '1' : '0.75',
fill: flipped ? '#FFFDF8' : c.fill,
toggle: () => { const o = Object.assign({}, open); o[i] = !flipped; this.setState({ open: o }); }
});
});
const sel = st.field === undefined ? 2 : st.field;
const fieldData = [
{ label: 'Deadline', value: 'Mar 3, 2027, 5:00 p.m. ET', status: 'Found', src: [5], note: 'Found on page 30. Staff check it in one glance.' },
{ label: 'Eligibility', value: 'Tenure-track, within 5 years', status: 'Found', src: [2], note: 'Found on page 7, far from the deadline.' },
{ label: 'Institutional limit', value: '2 per institution?', status: 'Check', src: [3, 4], note: 'Two rules disagree. The tool flags it instead of guessing, and a person decides.' },
{ label: 'Award', value: 'Up to $150,000 over 2 years', status: 'Found', src: [1], note: 'Found on page 3.' }
];
const fields = fieldData.map((f, i) => {
const on = i === sel;
return Object.assign({}, f, {
pressed: on ? 'true' : 'false',
bg: on ? '#FFFDF8' : 'rgba(255,253,248,0.55)',
border: on ? '#2E2A3B' : 'transparent',
statusInk: f.status === 'Check' ? '#B0573F' : '#2F6B45',
pick: () => this.setState({ field: i })
});
});
const paraData = [
{ page: 'p. 1', text: 'The Horizon Foundation invites proposals for its Early-Career Research Award, supporting bold work by new faculty.' },
{ page: 'p. 3', text: 'Each award provides up to $150,000 over two years. Indirect costs are not allowed.' },
{ page: 'p. 7', text: 'Applicants must hold a tenure-track appointment and be within five years of their first faculty position.' },
{ page: 'p. 12', text: 'Each institution may submit no more than two applications.' },
{ page: 'p. 28', text: 'FAQ: Institutions with more than one campus may submit one application per campus.' },
{ page: 'p. 30', text: 'Full proposals are due March 3, 2027, at 5:00 p.m. Eastern Time.' }
];
const cur = fieldData[sel];
const paras = paraData.map((p, i) => Object.assign({}, p, {
bg: cur.src.indexOf(i) >= 0 ? (cur.status === 'Check' ? 'rgba(229,154,140,0.45)' : 'rgba(233,185,73,0.45)') : 'transparent'
}));
return { cards: cards, fields: fields, paras: paras, note: cur.note };
}
}
