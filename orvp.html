<p style="margin: 0; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; color: #4A4458">What was really broken?</p>

<div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: center">

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Target user</p>
<p style="margin: 0">The research office staff who set up internal competitions for limited-submission funding calls.</p>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Problem statement</p>
<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 22px; line-height: 1.4">Staff read every long, dense funding call by hand and retype its rules into the competition system. The rules hide in different places in each document, and one missed limit goes out to the whole campus.</p>

<div style="flex: 1 1 280px; display: flex; justify-content: center">

<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Business outcome we aimed for</p><p style="margin: 6px 0 0">Show the office, within the pilot, that university-approved AI can make setup faster and more consistent, and leave behind assets staff can maintain without engineers.</p></div>

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">How we researched</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">3</p><p style="margin: 0">client staff answered our question list in one structured session</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">1</p><p style="margin: 0">hands-on walkthrough of the client's competition system</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">7</p><p style="margin: 0">real, public funding calls as our test set</p></div>
</div>
<p style="margin: 0; font-size: 16px; color: #4A4458">No competitive analysis: this is an internal tool for one office, so the comparison that mattered was against today's manual process.</p>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Key insights</p>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px">
<li><strong>The pain is translation, not search.</strong> Finding funding calls was fine. Turning one into a competition was slow and risky.</li>
<li><strong>Trust needs a source.</strong> Staff would only rely on an answer they could check against the original text in seconds.</li>
<li><strong>The system has no door.</strong> No API meant any tool had to fit around the system, not inside it.</li>
</ol>
<p style="margin: 0; font-size: 15px; color: #5A5468">Our interview notes, flowcharts and wireframes are covered by an NDA, so they are not shown here.</p>

<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1280,"height":7400}}'>
class Component extends DCLogic {
componentDidMount() {
const set = () => {
const h = document.documentElement;
const max = (h.scrollHeight - window.innerHeight) || 1;
h.style.setProperty('--p', Math.min(1, Math.max(0, window.scrollY / max)).toFixed(4));
h.style.setProperty('--d', Math.min(1, (window.scrollY + window.innerHeight * 0.75) / (h.scrollHeight || 1)).toFixed(4));
};
set();
window.addEventListener('scroll', set, { passive: true });
window.addEventListener('resize', set);
const parts = ['basics', 'research', 'decisions', 'results'].map(id => document.getElementById(id)).filter(Boolean);
if (window.IntersectionObserver && parts.length) {
const io = new IntersectionObserver(entries => {
entries.forEach(e => { if (e.isIntersecting) document.documentElement.setAttribute('data-part', e.target.id); });
}, { rootMargin: '-40% 0px -55% 0px' });
parts.forEach(p => io.observe(p));
}
}
renderVals() {
const st = this.state || {};
const open = st.open || {};
const cardData = [
{ want: 'An API into their system', got: 'No API at all', fill: '#F4C1B6',
  fix: 'We laid out the output in the exact field order of their system, with one-click copy for each field. No integration needed.' },
{ want: 'Internal documents and past data', got: 'Only public information', fill: '#D9D0F0',
  fix: 'Funding calls are public, so we used real ones as our test set and scored the tool against competitions staff had already built.' },
{ want: 'To know what the system needs', got: 'No view of the system', fill: '#F7E3A8',
  fix: 'I asked the client for access. We clicked through every screen and wrote down each field and its limits, so the AI fills in answers that actually fit.' }
];
const cards = cardData.map((c, i) => {
const flipped = !!open[i];
return Object.assign({}, c, {
front: !flipped, back: flipped,
expanded: flipped ? 'true' : 'false',
op: flipped ? '1' : '0.75',
fill: flipped ? '#FFFDF8' : c.fill,
toggle: () => { const o = Object.assign({}, open); o[i] = !flipped; this.setState({ open: o }); }
});
});
const sel = st.field === undefined ? 2 : st.field;
const fieldData = [
{ label: 'Deadline', value: 'Mar 3, 2027, 5:00 p.m. ET', status: 'Found', src: [5], note: 'Found on page 30. Staff check it in one glance.' },
{ label: 'Eligibility', value: 'Tenure-track, within 5 years', status: 'Found', src: [2], note: 'Found on page 7, far from the deadline.' },
{ label: 'Institutional limit', value: '2 per institution?', status: 'Check', src: [3, 4], note: 'Two rules disagree. The tool flags it instead of guessing, and a person decides.' },
{ label: 'Award', value: 'Up to $150,000 over 2 years', status: 'Found', src: [1], note: 'Found on page 3.' }
];
const fields = fieldData.map((f, i) => {
const on = i === sel;
return Object.assign({}, f, {
pressed: on ? 'true' : 'false',
bg: on ? '#FFFDF8' : 'rgba(255,253,248,0.55)',
border: on ? '#2E2A3B' : 'transparent',
statusInk: f.status === 'Check' ? '#B0573F' : '#2F6B45',
pick: () => this.setState({ field: i })
});
});
const paraData = [
{ page: 'p. 1', text: 'The Horizon Foundation invites proposals for its Early-Career Research Award, supporting bold work by new faculty.' },
{ page: 'p. 3', text: 'Each award provides up to $150,000 over two years. Indirect costs are not allowed.' },
{ page: 'p. 7', text: 'Applicants must hold a tenure-track appointment and be within five years of their first faculty position.' },
{ page: 'p. 12', text: 'Each institution may submit no more than two applications.' },
{ page: 'p. 28', text: 'FAQ: Institutions with more than one campus may submit one application per campus.' },
{ page: 'p. 30', text: 'Full proposals are due March 3, 2027, at 5:00 p.m. Eastern Time.' }
];
const cur = fieldData[sel];
const paras = paraData.map((p, i) => Object.assign({}, p, {
bg: cur.src.indexOf(i) >= 0 ? (cur.status === 'Check' ? 'rgba(229,154,140,0.45)' : 'rgba(233,185,73,0.45)') : 'transparent'
}));
return { cards: cards, fields: fields, paras: paras, note: cur.note };
}
}
