<div class="board" role="img" aria-label="Illustration of a bus arrivals board: one bus full, one delayed 15 minutes, one marked due that never arrives">

<p style="margin: 10px 0 0; font-size: 13px; color: #C9CED6">That last one never shows up. Students call it a ghost bus. Illustration built from the incidents students described.</p>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Target users</p><p style="margin: 6px 0 0"><strong>Riders:</strong> U-M students without a car who need to reach class, exams and errands on time. <strong>Carpool Hosts:</strong> students who already drive to campus with an empty seat.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Problem statement</p><p style="margin: 6px 0 0">Students without a car choose between a free bus that may be full, late or never come, and an Uber too expensive to use every day, while classmates drive the same way with empty seats.</p></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Product outcome we aimed for</p><p style="margin: 6px 0 0">Students without a car reach class, exams and errands on time, at a fraction of ride-hailing prices.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Business outcome we aimed for</p><p style="margin: 6px 0 0">A two-sided carpool marketplace that covers its costs from a small booking fee, while Hosts only get their gas money back.</p></div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">How we researched</p>

<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">32</p><p style="margin: 0">assumptions mapped by importance and evidence</p></div>

</div>
<div class="rv" style="display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 34px">≈ 40,650</span><span style="flex: 1 1 320px">U-M students with no car, using fall 2025 enrollment and our 76% no-car share. Our year-one goal was 5% of them: about 2,030 riders.</span></div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">In their words · 17 of 46 stories were about full or late buses</p>

<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 20px; line-height: 1.4"><strong>Key insight:</strong> a free bus isn't free if you can't get on it.</p>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">From 6 opportunities to 1 idea · team brainstorm</p>
<div class="ideas">
<div class="idea pick"><p class="ik">Idea 1 · picked</p><b>Scheduled campus carpool</b><span>Reserve a seat with a Host already driving to campus.</span></div>
<div class="idea"><p class="ik">Idea 2 · later phase</p><b>Group grocery runs</b><span>Weekly trips to Meijer or H Mart, fare split.</span></div>
<div class="idea"><p class="ik">Idea 3 · later phase</p><b>Break-time airport pools</b><span>Students matched by flight time to DTW.</span></div>
</div>
<p style="margin: 0">We scored ideas on <strong>customer value</strong> and <strong>feasibility</strong>. The commute to class was the most common and most frequent pain, and ideas 2 and 3 reuse the same matching, verification and payments, so they became later phases. Safety and Host incentives were built into all three.</p>

<section class="chapter" style="--tint: #EAF1F8; position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 22px">
<div id="decisions" class="chap-open">
<span class="chap-num" style="color: #2A5F8F">03</span>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2A5F8F">Part 3 of 4 · Tests &amp; pivot</p>
<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 38px; line-height: 1.1">Rerouting</h2>
<p style="margin: 0; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700; color: #4A4458">What changed our plan?</p>
</div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Step 1 · map what has to be true · team board</p>
<div class="arts one">
<figure><button type="button" class="zoomable" onClick="{{openMap}}" aria-label="Enlarge the assumption map"><img src="assets/onroute-assumptions.jpg" alt="Assumption map: 32 sticky notes sorted into desirability, viability, feasibility, usability and ethical columns, then placed on a 2 by 2 of importance and evidence" loading="lazy"><span class="zhint" aria-hidden="true">&#x2922; Enlarge</span></button><figcaption><strong>32 assumptions</strong>, sorted by importance and evidence. Top right means test first.</figcaption></figure>
</div>
<p style="margin: 0; max-width: 800px">Step 2 · test the riskiest. Our first plan was a rescue: when your bus fails, book a seat with a student already driving your way, for about $1.29. I tested it with 10 riders who take the bus at least three times a week. Try the two scenarios I gave them.</p>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">My test · would you pay $1.29?</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px">
<sc-for list="{{scenarios}}" as="q" hint-placeholder-count="2">
<div style="position: relative; padding: 26px 24px; display: flex; flex-direction: column; gap: 12px">
<svg viewBox="0 0 300 360" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><path d="M12 20 C 100 8, 200 14, 288 10 C 296 120, 294 240, 286 350 C 200 356, 100 354, 14 352 C 6 240, 8 120, 12 20 Z" fill="{{q.fill}}" filter="url(#wc)" style="opacity: 0.55"></path></svg>
<p style="position: relative; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">{{q.tag}}</p>
<p style="position: relative; margin: 0; font-family: 'Fraunces', serif; font-size: 21px; font-weight: 700; line-height: 1.35">{{q.question}}</p>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" onClick="{{q.pickA}}" aria-pressed="{{q.aPressed}}" style="font: inherit; font-weight: 700; font-size: 15px; color: {{q.aInk}}; background: {{q.aBg}}; border: 2px solid #2E2A3B; border-radius: 14px 10px 16px 8px; padding: 8px 14px; min-height: 44px; cursor: pointer">Wait for the next bus</button>
<button type="button" onClick="{{q.pickB}}" aria-pressed="{{q.bPressed}}" style="font: inherit; font-weight: 700; font-size: 15px; color: {{q.bInk}}; background: {{q.bBg}}; border: 2px solid #2E2A3B; border-radius: 10px 16px 8px 14px; padding: 8px 14px; min-height: 44px; cursor: pointer">Book a seat · $1.29</button>
</div>
<sc-if value="{{q.answered}}" hint-placeholder-val="{{ false }}">
<div class="pop" style="position: relative; display: flex; align-items: baseline; gap: 12px"><span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 52px; line-height: 1; color: {{q.statInk}}">{{q.stat}}</span><span style="font-weight: 700">{{q.statLabel}}</span></div>
<p class="pop" style="position: relative; margin: 0">{{q.why}}</p>
</sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{payBoth}}" hint-placeholder-val="{{ false }}">
<div class="pop" style="max-width: 760px; margin: 0 auto; background: #FFFDF8; border: 2px solid #2E2A3B; border-radius: 18px 14px 20px 12px; padding: 16px 20px; text-align: center">
<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 20px; line-height: 1.4"><strong>What I learned:</strong> riders don't pay to escape a bad bus. They pay to protect something that matters, and those moments are mostly ones they can see coming.</p>
</div>
</sc-if>
<sc-if value="{{payWaiting}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #5A5468; text-align: center">Answer both to see what I learned.</p></sc-if>
<p style="margin: 0; font-size: 14px; color: #5A5468">Honest caveat: these are stated answers. Our pass bar was a refundable $1.29 deposit, which we haven't collected yet, so I labeled this test inconclusive.</p>

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">All five tests · pass bars written down before we ran them</p>
<div class="tests">
<sc-for list="{{tests}}" as="t" hint-placeholder-count="5">
<div class="trow rv">
<span class="tn">{{t.n}}</span>
<div style="min-width: 0"><p style="margin: 0; font-weight: 700">{{t.title}} <sc-if value="{{t.mine}}" hint-placeholder-val="{{ false }}"><span class="mine">my test</span></sc-if></p><p style="margin: 2px 0 0; font-size: 15px; color: #4A4458">{{t.result}}</p></div>
<span class="lbl {{t.cls}}">{{t.label}}</span>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #5A5468">Three of five came back inconclusive, mostly because samples fell short of plan. I kept those labels rather than rounding them up.</p>

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">My Host test · 4 drivers</p>
<p style="margin: 0">2 of 4 picked a real hosting slot, both with longer commutes. The 2 who said no drive 2 to 10 minutes, too short for gas money to matter. Every driver could commit to fixed times, not last-minute requests.</p>

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">The pivot · from rescue rides to planned rides</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch">
<div class="rv" style="flex: 1 1 260px; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #A04A2E">first plan</p><p style="margin: 4px 0 0">An on-demand rescue: book a seat the moment your bus fails you.</p></div>
<div style="flex: 0 0 auto; display: flex; align-items: center; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700">→</div>
<div class="rv" style="flex: 1 1 260px; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #5A5468">what we learned</p><p style="margin: 4px 0 0">Rider need was urgent and last-minute, but Hosts could only commit to fixed slots. That timing gap was the biggest risk we found.</p></div>
<div style="flex: 0 0 auto; display: flex; align-items: center; font-family: 'Caveat', cursive; font-size: 26px; font-weight: 700">→</div>
<div class="rv" style="flex: 1 1 260px; background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #2F6B45">new focus</p><p style="margin: 4px 0 0">Planned trips where being on time matters, like morning classes and exams: standing weekly rides, a flexible time window, and a backup if the Host runs late.</p></div>
</div>

<p style="margin: 0">A working prototype of the planned-ride flow: book a weekly seat, see the Host's checks and the full fare, and get a faster backup when a Host runs late. There is a Host view too. All data is sample data.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Each feature answers a test result</p>

<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 20px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #2A5F8F">time window</p><p style="margin: 4px 0 0">Riders who missed a match missed on time, not route, so search widens to ±15 minutes.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 20px"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #2A5F8F">standing rides</p><p style="margin: 4px 0 0">Riders pay for trips that matter, so you book your class days once.</p></div>

<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Results</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px">
<div style="position: relative; padding: 28px 24px"><svg viewBox="0 0 300 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><ellipse cx="150" cy="100" rx="140" ry="90" fill="#E9B949" filter="url(#wc)" style="opacity: 0.45"></ellipse></svg><p style="position: relative; margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 52px; line-height: 1">7 of 10</p><p style="position: relative; margin: 8px 0 0">riders missed or nearly missed a time-critical trip in two weeks: 24 times in all</p></div>
<div style="position: relative; padding: 28px 24px"><svg viewBox="0 0 300 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><ellipse cx="150" cy="100" rx="140" ry="90" fill="#9CC3A5" filter="url(#wc)" style="opacity: 0.5"></ellipse></svg><p style="position: relative; margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 52px; line-height: 1">8 of 12</p><p style="position: relative; margin: 8px 0 0">riders had a potential Host match on trips they already make</p></div>
<div style="position: relative; padding: 28px 24px"><svg viewBox="0 0 300 200" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><ellipse cx="150" cy="100" rx="140" ry="90" fill="#8FB3D9" filter="url(#wc)" style="opacity: 0.5"></ellipse></svg><p style="position: relative; margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 52px; line-height: 1">3 of 6</p><p style="position: relative; margin: 8px 0 0">Hosts would upload their license and insurance; the rest worried about privacy</p></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">What we built</p><p style="margin: 6px 0 0">A working app prototype in Lovable for both riders and Hosts. Bookings, checks and payments are simulated.</p></div>

</div>
<p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Did we reach the outcomes we aimed for?</p>
<div class="otable" role="table" aria-label="Outcome measures and status">
<div class="orow ohead" role="row"><span role="columnheader">Measure we set</span><span role="columnheader">What we found</span><span role="columnheader">Status</span></div>
<div class="orow" role="row"><span role="cell"><b>Match rate</b> · searches that find a ride</span><span role="cell">8 of 12 riders had a potential match, but from neighbors, not strangers</span><span role="cell"><i class="lbl inc">Early signal</i></span></div>
<div class="orow" role="row"><span role="cell"><b>On-time arrival</b> · booked rides that arrive on time</span><span role="cell">Not measured. Host punctuality is the next test</span><span role="cell"><i class="lbl not">Not yet tested</i></span></div>
<div class="orow" role="row"><span role="cell"><b>Riders pay the fee</b> · $1.29 a trip</span><span role="cell">10 of 10 said yes when late had a cost; stated intent, not yet a real deposit</span><span role="cell"><i class="lbl inc">Not yet proven</i></span></div>
<div class="orow" role="row"><span role="cell"><b>Enough Hosts</b> · on the right routes and times</span><span role="cell">2 of 4 drivers picked a slot</span><span role="cell"><i class="lbl inc">Not yet proven</i></span></div>
<div class="orow" role="row"><span role="cell"><b>Fees cover costs</b> · revenue per ride vs cost</span><span role="cell">Modeled only: about $41,600 a year at 5% capture</span><span role="cell"><i class="lbl not">Not yet tested</i></span></div>
</div>
<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 20px; line-height: 1.4"><strong>Verdict:</strong> not achieved yet. We proved the problem and found early route overlap. Real payment and on-time Hosts need a pilot.</p>
</section>

<section style="position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 32px; display: flex; flex-direction: column; gap: 22px">
<p style="margin: 0; font-family: 'Caveat', cursive; font-size: 30px; font-weight: 700; color: #6A4F9A">end of the line · my reflection</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px">
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px; transform: rotate(-0.5deg)"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #2F6B45">what went well</p><ul style="margin: 6px 0 0; padding-left: 20px"><li>Writing pass bars before testing, then reporting the weak number (2 of 10) next to the strong one (10 of 10).</li><li>A bilingual survey: 27 of 46 students chose the Chinese version.</li><li>Asking about behavior, not opinions: the last two weeks, and a real hosting slot.</li><li>Letting the evidence change the concept, instead of defending the first idea.</li></ul></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px; transform: rotate(0.4deg)"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #B0573F">what didn't</p><ul style="margin: 6px 0 0; padding-left: 20px"><li>Too few Hosts. I planned 8 and reached 4, and the drivers from our route survey were anonymous, so I couldn't invite them back.</li><li>"Would you pay if you were running late?" was too easy to say yes to. 10 of 10 did, but it was only stated intent.</li></ul></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px; transform: rotate(-0.3deg)"><p style="margin: 0; font-family: 'Caveat', cursive; font-size: 24px; font-weight: 700; color: #2A5F8F">next time</p><ul style="margin: 6px 0 0; padding-left: 20px"><li>Ask for a real deposit, tied to one specific trip.</li><li>Ask permission to follow up in every short survey.</li><li>Count a Host as committed only once they drive the slot.</li></ul></div>
</div>
</section>

<section style="position: relative; max-width: 1040px; margin: 0 auto; padding: 24px 32px 56px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-family: 'Caveat', cursive; font-size: 28px; font-weight: 700; color: #2F6B45">what's next</p>
<p style="margin: 0; font-family: 'Fraunces', serif; font-size: 24px; line-height: 1.4; max-width: 840px">Next stop is our final pitch. After that, a small pilot on one crowded route: real $1.29 deposits for a specific morning class, Hosts with longer commutes who actually drive their slot, and a check on whether riders book before the week starts.</p>
</section>

h.style.setProperty('--d', Math.min(1, (window.scrollY + window.innerHeight * 0.75) / (h.scrollHeight || 1)).toFixed(4));
};
set();
window.addEventListener('scroll', set, { passive: true });

});
});

];

// --- Phone demo ---
const ph = st.ph || { screen: 'search', win: false, repeat: true, choice: '' };

const order = { search: 0, results: 0, host: 1, booked: 2, late: 3 };

['Check the Host, then reserve', 'See the checks and how $1.29 splits. Keep “Every Wednesday” on.'],
['Jump to Wednesday', 'Your standing ride is set. Skip ahead to the morning of class.'],
['Your Host is late. Pick a plan', 'Keep Maya, or switch to the suggested backup.']
];

on: (!finished && i === cur) ? 'true' : 'false',
done: (i < cur || (finished && i === 3)) ? 'true' : 'false' }));

const openLb = (k) => () => { document.body.style.overflow = 'hidden'; this.setState({ lb: k, lbz: false }); };
const closeLb = (e) => { if (e && e.target && e.target.closest && e.target.closest('.lb-img') ) return; document.body.style.overflow = ''; this.setState({ lb: '', lbz: false }); };
const op = st.open || {};
const tog = (k) => () => this.setState({ open: Object.assign({}, op, { [k]: !op[k] }) });
return {
t_p1: tog('p1'), o_p1: op.p1 ? 'true' : 'false', s_p1: !!op.p1, l_p1: op.p1 ? 'Hide details ↑' : 'See who it is for and our goals' + ' ↓',
t_p2: tog('p2'), o_p2: op.p2 ? 'true' : 'false', s_p2: !!op.p2, l_p2: op.p2 ? 'Hide details ↑' : 'See student quotes and how we picked the idea' + ' ↓',
t_p3: tog('p3'), o_p3: op.p3 ? 'true' : 'false', s_p3: !!op.p3, l_p3: op.p3 ? 'Hide details ↑' : 'See all 5 tests and the assumption map' + ' ↓',
t_p4: tog('p4'), o_p4: op.p4 ? 'true' : 'false', s_p4: !!op.p4, l_p4: op.p4 ? 'Hide details ↑' : 'See how each feature answers a test' + ' ↓',
t_p5: tog('p5'), o_p5: op.p5 ? 'true' : 'false', s_p5: !!op.p5, l_p5: op.p5 ? 'Hide details ↑' : 'See what worked and what I would change' + ' ↓',
t_p6: tog('p6'), o_p6: op.p6 ? 'true' : 'false', s_p6: !!op.p6, l_p6: op.p6 ? 'Hide details ↑' : 'See the next four tests' + ' ↓',
hasApp: !!APP_URL, appUrl: APP_URL, hasVideo: !!VIDEO_SRC, noVideo: !VIDEO_SRC, videoSrc: VIDEO_SRC, videoPoster: VIDEO_POSTER,
openVpc: openLb('vpc'), openEco: openLb('eco'), openMap: openLb('map'), lbW: lb === 'map' ? 3200 : 2000,
lbOpen: !!lb, lbSrc: lb ? lbData[lb][0] : '', lbTitle: lb ? lbData[lb][1] : '',
lbZoomed: st.lbz ? 'true' : 'false', lbZoomLabel: st.lbz ? 'Fit to screen' : 'Zoom in',
lbZoom: (e) => { if (e && e.nativeEvent) e.nativeEvent.stopPropagation(); this.setState({ lbz: !st.lbz }); },
lbClose: closeLb,
team: TEAM.map(m => ({ name: m.name, role: m.role, url: m.url, linked: !!m.url, plain: !m.url })),
scenarios: scenarios, payBoth: payBoth, payWaiting: !payBoth,
tests: tests,
phSteps: phSteps, phAllDone: finished,
phReset: () => this.setState({ ph: { screen: 'search', win: false, repeat: true, choice: '' } }),
