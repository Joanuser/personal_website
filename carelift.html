<h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px; line-height: 1.15">It's 7 p.m. Her heart medicine runs out tonight.</h2>
<p style="margin: 0">Margaret is 74 and lives alone in northern Michigan. She stopped driving. Her nearest pharmacy is 25 minutes away and closed at 6. Her daughter is three hours away.</p>
<p style="margin: 0; font-size: 15px; color: #5A5468">A representative persona built from public data and our interviews.</p>
</div>

<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Problem statement</p><p style="margin: 6px 0 0">Older patients in rural areas can run out of a critical medicine after the pharmacy closes, with no fast way to get it, while pharmacies and drone companies can't see each other or the patient's need.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Product outcome we aimed for</p><p style="margin: 6px 0 0">Request to door in under 30 minutes, any pharmacy, any hour, in a few simple taps.</p></div>
<div class="rv" style="background: #FFFDF8; border: 1.5px solid #E6DCCB; border-radius: 22px 18px 24px 16px; padding: 22px 24px"><p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5468">Business outcome we aimed for</p><p style="margin: 6px 0 0">A platform fee on every delivery, starting in rural Michigan within a $0.9B rural U.S. market.</p></div>
</div>
